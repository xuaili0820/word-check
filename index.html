<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f9">
<title>今日单词检测</title>
<style>
  :root{
    --bg:#eef3f9; --card:#ffffff; --ink:#102a43; --ink-2:#5a7189; --muted:#8fa3b8;
    --blue:#1e5aa8; --blue-dark:#12395c; --blue-soft:#edf4ff;
    --line:#e0e8f2; --warn:#b04a3a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#f7fafd 0%,var(--bg) 340px,var(--bg) 100%);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    min-height:100vh;overflow-x:hidden;
    padding:22px 16px 44px;
  }
  .wrap{width:100%;max-width:560px;margin:0 auto;min-width:0}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:0 2px}
  .mark{
    width:30px;height:30px;border-radius:8px;background:var(--blue-dark);color:#fff;
    display:grid;place-items:center;font:700 12px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.04em;
  }
  .brand-t{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.2em}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 8px 28px rgba(16,42,67,.06);padding:26px 24px 28px;
  }
  h1{font-size:24px;line-height:1.4;margin:0 0 14px;letter-spacing:.01em;font-weight:700;position:relative;padding-bottom:14px}
  h1::after{content:"";position:absolute;left:0;bottom:0;width:38px;height:3px;background:var(--blue);border-radius:2px}
  .sub{color:var(--ink-2);font-size:13.5px;line-height:1.8;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
  .chip{
    font-size:12.5px;color:#365a7d;background:#fff;border:1px solid var(--line);
    border-radius:6px;padding:5px 10px;font-weight:600;
  }
  .rule{
    border-top:1px solid var(--line);margin:22px 0 0;padding-top:14px;
    color:var(--muted);font-size:12.5px;line-height:1.8;
  }
  .btn{
    width:100%;border:0;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:600;
    font-family:inherit;cursor:pointer;transition:background .15s ease,border-color .15s ease;
  }
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:#17497f}
  .btn-primary:active{background:var(--blue-dark)}
  .btn-primary:disabled{background:#e8eef7;color:#a3b5c9;cursor:default}
  .btn-ghost{background:#fff;color:var(--blue);border:1px solid #c9d8e8}
  .btn-ghost:hover{border-color:var(--blue)}
  .btn-ghost:disabled{opacity:.45;cursor:default;border-color:#dfe7f2}
  .btn-row{display:flex;gap:10px;margin-top:22px}
  .screen{display:none}
  .screen.active{display:block;animation:fade .25s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12.5px;color:var(--ink-2)}
  .topbar b{color:var(--ink);font-size:14px}
  .bar{height:4px;background:#e6eef8;border-radius:99px;overflow:hidden;margin-bottom:22px}
  .bar > i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .25s ease}
  .qtype{
    display:inline-block;font-size:11.5px;font-weight:700;color:var(--blue);
    letter-spacing:.1em;border-left:3px solid var(--blue);padding-left:8px;margin-bottom:16px;
  }
  .stem{min-height:104px;display:flex;flex-direction:column;justify-content:center;margin-bottom:22px}
  .stem .en{font:600 34px/1.25 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
  .stem .zh{font-size:20px;line-height:1.6;font-weight:600;overflow-wrap:anywhere}
  .stem .hint{font-size:12.5px;color:var(--muted);margin-top:10px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:#fff;border:1px solid #dfe7f2;border-radius:10px;padding:13px 14px;
    font-family:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;
    line-height:1.5;transition:border-color .15s,background .15s;
  }
  .opt:hover{border-color:#b9cde6}
  .opt .k{
    flex:none;width:24px;height:24px;border-radius:6px;background:#eef4fb;color:#6b8399;
    display:grid;place-items:center;font-size:12px;font-weight:700;
  }
  .opt.on{border-color:var(--blue);background:#f5f9ff}
  .opt.on .k{background:var(--blue);color:#fff}
  .opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}

  .eyebrow{font-size:11.5px;color:var(--muted);letter-spacing:.18em;font-weight:600}
  .score{display:flex;align-items:baseline;gap:8px;margin:8px 0 2px}
  .score .n{font:600 54px/1 Georgia,serif;color:var(--ink)}
  .score .d{font-size:17px;color:var(--muted)}
  .verdict{font-size:14px;color:var(--ink-2);margin:14px 0 4px;line-height:1.85}
  .polaroid{display:flex;gap:5px;flex-wrap:wrap;margin:18px 0 6px}
  .dot{width:21px;height:5px;border-radius:2px;background:var(--blue)}
  .dot.bad{background:var(--warn)}
  .review{margin-top:24px;border-top:1px solid var(--line);padding-top:4px}
  .review h2{font-size:11.5px;color:var(--muted);font-weight:700;margin:16px 0 4px;letter-spacing:.16em}
  .item{padding:14px 0;border-bottom:1px solid #eff4f9}
  .item:last-child{border-bottom:0}
  .item .w{font:600 19px/1.4 Georgia,serif}
  .item .ipa{font:italic 13px/1.5 Georgia,"Times New Roman",serif;color:var(--muted);margin-top:2px}
  .item .m{font-size:13px;color:var(--ink-2);line-height:1.75;margin-top:3px}
  .item .ans{font-size:12.5px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
  .ok{color:var(--blue)}
  .no{color:var(--warn)}
  .fields{display:flex;gap:10px;margin:18px 0 0;flex-wrap:wrap}
  .field{flex:1 1 140px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2);font-weight:600}
  .field i{font-style:normal;color:var(--muted);font-weight:400}
  .field input{
    font:inherit;font-size:15px;font-weight:400;color:var(--ink);background:#fff;
    border:1px solid #d9e3ef;border-radius:9px;padding:10px 12px;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,90,168,.08)}
  .field input::placeholder{color:#a9b8c8}
  .formerr{color:var(--warn);font-size:12.5px;margin:8px 0 0}
  .privacy{color:var(--muted);font-size:11.5px;line-height:1.7;margin:8px 0 0}
  .submit-note{margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7}
  .submit-note.ok{color:var(--blue)}
  .submit-note.no{color:var(--warn)}
  .submit-note button{
    background:none;border:0;color:var(--blue);font:inherit;font-weight:600;
    cursor:pointer;padding:0 2px;text-decoration:underline;
  }
  #startBtn{margin-top:20px}
  .foot{text-align:center;color:#a7b7c8;font-size:11.5px;margin-top:20px;letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark">EN</div>
    <div class="brand-t">WORD CHECK</div>
  </div>

  <!-- 开始 -->
  <section class="screen active card" id="s-start">
    <h1>今日单词检测</h1>
    <p class="sub">355 个高频词，每次随机抽 10 题。交卷后出分，错题附音标与完整释义。</p>
    <div class="chips">
      <span class="chip">355 个词</span>
      <span class="chip">10 道随机题</span>
      <span class="chip">随时重测</span>
    </div>
    <div class="fields">
      <label class="field"><span>姓名</span><input id="stuName" maxlength="20" placeholder="请输入姓名" autocomplete="name"></label>
      <label class="field"><span>班级 <i>选填</i></span><input id="stuClass" maxlength="20" placeholder="如：高一3班" autocomplete="off"></label>
    </div>
    <p class="formerr" id="formErr" hidden>请填写姓名后再开始。</p>
    <p class="privacy">姓名与成绩仅用于课堂统计，老师可见；不收集手机号等信息。</p>
    <button class="btn btn-primary" id="startBtn">开始检测</button>
    <div class="rule">每次打开都会重新抽题，可反复练习直到整张词表过一遍。</div>
  </section>

  <!-- 答题 -->
  <section class="screen card" id="s-quiz">
    <div class="topbar"><span>第 <b id="curNo">1</b> / 10 题</span><span id="doneNo">已答 0 题</span></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="qtype" id="qtype">英译中</div>
    <div class="stem" id="stem"></div>
    <div class="opts" id="opts"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="prevBtn" style="flex:1">上一题</button>
      <button class="btn btn-primary" id="nextBtn" style="flex:1.6" disabled>下一题</button>
    </div>
  </section>

  <!-- 结果 -->
  <section class="screen card" id="s-result">
    <div class="eyebrow">本次得分</div>
    <div class="score"><span class="n" id="scoreN">0</span><span class="d">/ 10</span></div>
    <div class="polaroid" id="polaroid"></div>
    <p class="verdict" id="verdict"></p>
    <p class="submit-note" id="submitNote"></p>
    <div id="wrongBox"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="homeBtn" style="flex:1">返回首页</button>
      <button class="btn btn-primary" id="againBtn" style="flex:1.6">再测一组</button>
    </div>
  </section>

  <div class="foot">688 高频词 · 355 词</div>
</div>

<script src="supabase.js"></script>
<script src="config.js"></script>

function shuffle(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

function posOf(m){
  const t = (m||'').trim().split(/\s+/)[0] || '';
  return /^(n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int)\./i.test(t) ? t.toLowerCase() : '';
}

function shortMeaning(m, max){
  max = max || 16;
  let s = (m||'').replace(/\s+/g,' ').trim();
  s = s.split(/[；;]/)[0];
  s = s.replace(/[，,。]\s*$/,'');
  return s.length > max ? s.slice(0,max) : s;
}

function buildQuiz(){
  const all = shuffle(DATA);
  const picked = all.slice(0, Math.min(10, all.length));
  const types = shuffle([...Array(5).fill('e2c'), ...Array(5).fill('c2e')]);
  const qs = [];
  picked.forEach((word, i) => {
    const type = types[i % types.length];
    const others = all.filter(w => w.w !== word.w);
    let options, answer;
    if(type === 'e2c'){
      answer = shortMeaning(word.m);
      const seen = new Set([answer]);
      const samePos = others.filter(w => posOf(w.m) === posOf(word.m));
      const pool = [...shuffle(samePos), ...shuffle(others)];
      options = [answer];
      for(const w of pool){
        const s = shortMeaning(w.m);
        if(!s || seen.has(s)) continue;
        seen.add(s); options.push(s);
        if(options.length === 4) break;
      }
    } else {
      answer = word.w;
      const seen = new Set([answer]);
      const samePos = others.filter(w => posOf(w.m) === posOf(word.m));
      const pool = [...shuffle(samePos), ...shuffle(others)];
      options = [answer];
      for(const w of pool){
        if(seen.has(w.w)) continue;
        seen.add(w.w); options.push(w.w);
        if(options.length === 4) break;
      }
    }
    options = shuffle(options);
    qs.push({ type, word, stem: type === 'e2c' ? word.w : word.m, answer, options });
  });
  return qs;
}

  window.scrollTo({top:0, behavior:'smooth'});
}

function startQuiz(){
  const nameEl = $('stuName'), clsEl = $('stuClass');
  const name = nameEl.value.trim().slice(0, 20);
  const klass = clsEl.value.trim().slice(0, 20);
  if(!name){
    $('formErr').hidden = false;
    nameEl.focus();
    return;
  }
  $('formErr').hidden = true;
  try {
    localStorage.setItem(NAME_KEY, name);
    localStorage.setItem(CLASS_KEY, klass);
  } catch(e){}

  S.meta = { name, klass, startedAt: new Date().toISOString(), subId: uid() };
  S.submitted = false;
  S.qs = buildQuiz(); S.idx = 0; S.ans = new Array(S.qs.length).fill(null);
  $('submitNote').textContent = '';
  show('s-quiz'); render();
}

function render(){
  const q = S.qs[S.idx];
  $('curNo').textContent = S.idx + 1;
  $('barFill').style.width = ((S.idx) / S.qs.length * 100) + '%';
  $('doneNo').textContent = '已答 ' + S.ans.filter(v => v !== null).length + ' 题';

  $('qtype').textContent = q.type === 'e2c' ? '英译中 · 选出正确词义' : '中译英 · 选出对应单词';
  const stem = $('stem');
  if(q.type === 'e2c'){
    stem.innerHTML = '<div class="en">' + esc(q.stem) + '</div><div class="hint">它的意思是？</div>';
  } else {
    stem.innerHTML = '<div class="zh">' + esc(q.stem) + '</div><div class="hint">对应哪个单词？</div>';
  }

  const box = $('opts');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt' + (S.ans[S.idx] === opt ? ' on' : '');
    b.innerHTML = '<span class="k">' + KEYS[i] + '</span><span class="txt">' + esc(opt) + '</span>';
    b.onclick = () => {
      S.ans[S.idx] = opt;
      [...box.children].forEach((c, j) => c.classList.toggle('on', j === i));
      $('nextBtn').disabled = false;
      $('doneNo').textContent = '已答 ' + S.ans.filter(v => v !== null).length + ' 题';
      if(S.idx < S.qs.length - 1) setTimeout(() => { if(S.ans[S.idx] === opt) next(); }, 220);
    };
    box.appendChild(b);
  });

  $('prevBtn').disabled = S.idx === 0;
  const last = S.idx === S.qs.length - 1;
  $('nextBtn').textContent = last ? '提交并查看结果' : '下一题';
  $('nextBtn').disabled = S.ans[S.idx] === null;
}

function next(){
  if(S.idx < S.qs.length - 1){ S.idx++; render(); }
  else { finish(); }
}

function finish(){
  let right = 0;
  const pol = $('polaroid'); pol.innerHTML = '';
  const items = [];
  const detail = [];
  S.qs.forEach((q, i) => {
    const ok = S.ans[i] === q.answer;
    if(ok) right++;
    detail.push({ type: q.type, word: q.word.w, mean: q.word.m, answer: q.answer, picked: S.ans[i], ok });
    const d = document.createElement('i');
    d.className = 'dot' + (ok ? '' : ' bad');
    pol.appendChild(d);
    if(!ok) items.push({ q, mine: S.ans[i] });
  });
  $('scoreN').textContent = right;
  const v = right === 10 ? '全部正确，这批词掌握得很扎实。明天可只复习错词。'
    : right >= 8 ? '基础扎实。把下面几道错题读两遍，记入错题本。'
    : right >= 6 ? '有印象但不够牢固，建议今晚重点过一遍错题。'
    : '生词较多，先把错题和音标读熟，明天再测一次。';
  $('verdict').textContent = v;

  const box = $('wrongBox');
  if(!items.length){
    box.innerHTML = '<div class="review"><h2>本次全对</h2><p class="sub">10 题全部正确。</p></div>';
  } else {
    let html = '<div class="review"><h2>错题解析 · ' + items.length + ' 题</h2>';
    items.forEach(({q, mine}) => {
      html += '<div class="item">'
        + '<div class="w">' + esc(q.word.w) + '</div>'
        + (q.word.ipa ? '<div class="ipa">' + esc(q.word.ipa) + '</div>' : '')
        + '<div class="m">' + esc(q.word.m) + '</div>'
        + '<div class="ans"><span class="no">你选：' + esc(mine === null ? '未作答' : mine) + '</span>'
        + '<span class="ok">正确：' + esc(q.answer) + '</span></div>'
        + '</div>';
    });
    html += '</div>';
    box.innerHTML = html;
  }
  show('s-result');
  submitResult(right, detail);
}

let dbClient = null;
function getClient(){
  if(!window.supabase || typeof window.supabase.createClient !== 'function') throw new Error('SDK 未加载');
  if(!dbClient) dbClient = window.supabase.createClient(CFG.url, CFG.anonKey);
  return dbClient;
}

async function submitResult(score, detail){
  const note = $('submitNote');
  const meta = S.meta;
  if(!meta || S.submitted) return;
  if(!CFG.url || !CFG.anonKey){
    note.className = 'submit-note';
    note.textContent = '本地预览：未连接统计后台，本次成绩不会上传。';
    return;
  }

  const payload = {
    sub_id: meta.subId,
    name: meta.name,
    klass: meta.klass || '',
    quiz: 'weekly',
    score,
    total: S.qs.length,
    duration_ms: Math.max(0, Date.now() - new Date(meta.startedAt).getTime()),
    started_at: meta.startedAt,
    answers: detail
  };
  const delays = [1000, 3000, 6000];
  const current = () => S.meta && S.meta.subId === meta.subId;

  for(let attempt = 0; attempt <= 3; attempt++){
    if(!current()) return;
    note.className = 'submit-note';
    note.textContent = attempt === 0 ? '正在提交成绩…' : '提交失败，正在重试（' + attempt + '/3）…';
    try {
      const res = await getClient().from(CFG.table || 'submissions').insert(payload);
      if(res && res.error) throw res.error;
      if(!current()) return;
      S.submitted = true;
      note.className = 'submit-note ok';
      note.textContent = '成绩已提交给老师。';
      return;
    } catch(e){
      if(!current()) return;
      if(attempt === 3){
        note.className = 'submit-note no';
        note.innerHTML = '成绩已生成，但提交未成功。<button type="button" id="retryBtn">重新提交</button>';
        $('retryBtn').onclick = () => submitResult(score, detail);
        return;
      }
      await new Promise(r => setTimeout(r, delays[attempt]));
    }
  }
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

try {
  $('stuName').value = localStorage.getItem(NAME_KEY) || '';
  $('stuClass').value = localStorage.getItem(CLASS_KEY) || '';
} catch(e){}

$('startBtn').onclick = startQuiz;
$('againBtn').onclick = startQuiz;
$('homeBtn').onclick = () => show('s-start');
$('prevBtn').onclick = () => { if(S.idx > 0){ S.idx--; render(); } };
$('nextBtn').onclick = next;
</script>
</body>
